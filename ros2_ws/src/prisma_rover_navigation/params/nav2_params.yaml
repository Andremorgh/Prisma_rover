controller_server:
  ros__parameters:
    use_sim_time: True
    odom_topic: odometry/filtered
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15

    FollowPath:
      plugin: "teb_local_planner::TebLocalPlannerROS"
      map_frame: prisma_rover/map

      # Trajectory
      teb_autosize: 1.0 
      dt_ref: 0.5 
      dt_hysteresis: 0.2 
      global_plan_overwrite_orientation: True
      max_global_plan_lookahead_dist: 2.0 
      feasibility_check_no_poses: 5
      publish_feedback: true

      # Robot
      max_vel_x: 0.3
      max_vel_x_backwards: 0.05
      max_vel_theta: 4.0
      acc_lim_x: 1.0
      acc_lim_theta: 4.0
      min_turning_radius: 0.0
      footprint_model:
        type: "circular"
        radius: 0.3

      # GoalTolerance
      xy_goal_tolerance: 0.15  
      yaw_goal_tolerance: 0.15  
      free_goal_vel: False

      # Obstacles
      min_obstacle_dist: 0.1 
      include_costmap_obstacles: True
      costmap_obstacles_behind_robot_dist: 1.0
      obstacle_poses_affected: 20
      costmap_converter_plugin: ""
      costmap_converter_spin_thread: True
      costmap_converter_rate: 5.0
      inflation_dist: 0.1
      include_dynamic_obstacles: True

      # Optimization
      no_inner_iterations: 3  
      no_outer_iterations: 2 
      optimization_activate: True
      optimization_verbose: False
      penalty_epsilon: 0.04 
      weight_max_vel_x: 2.0
      weight_max_vel_theta: 1.0
      weight_acc_lim_x: 1.0
      weight_acc_lim_theta: 1.0
      weight_kinematics_nh: 1000.0
      weight_kinematics_forward_drive: 200.0 
      weight_kinematics_turning_radius: 1.0
      weight_optimaltime: 1.0
      weight_obstacle: 100.0 
      weight_dynamic_obstacle: 10.0 
      selection_alternative_time_cost: False 

      # Homotopy Class Planner
      enable_homotopy_class_planning: False
      enable_multithreading: True
      simple_exploration: False
      max_number_classes: 4
      roadmap_graph_no_samples: 15
      roadmap_graph_area_width: 5.0
      h_signature_prescaler: 0.5
      h_signature_threshold: 0.1

# Local Costmap: Configured for real-time obstacle avoidance around the robot.
# Uses a rolling window of 6x6 meters centered on base_footprint.
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0 # High update rate for fast obstacle response
      publish_frequency: 5.0
      global_frame: prisma_rover/odom # Fixed frame is odom to avoid jumps caused by SLAM map updates
      robot_base_frame: prisma_rover/base_footprint
      use_sim_time: True
      rolling_window: true # Moves with the robot
      width: 6 # 6 meters wide
      height: 6 # 6 meters tall
      resolution: 0.05 # 5cm grid cell resolution
      robot_radius: 0.3 # Matches physical rover footprint radius (30cm)
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0 
        inflation_radius: 0.3 # Inflate obstacles by the robot's physical radius
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          # Listens to /prisma_rover/scan. In 3D mode, the pointcloud is projected to this topic.
          topic: /prisma_rover/scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True
      qos_overrides:
        scan:
          reliability: SENSOR_DATA
          durability: volatile      

# Global Costmap: Configured for global path planning.
# Uses static SLAM occupancy grid map with dynamic obstacle overlay.
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0 # Lower frequency as global path changes less often
      publish_frequency: 1.0
      global_frame: prisma_rover/map # Fixed frame is the global map
      robot_base_frame: prisma_rover/base_footprint
      use_sim_time: True
      robot_radius: 0.3
      resolution: 0.05
      track_unknown_space: true # Allow exploration planning through unknown spaces
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /prisma_rover/scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0 
        inflation_radius: 0.4 # Higher inflation than local for safer global path planning
      always_send_full_costmap: True
      qos_overrides:
        scan:
          reliability: SENSOR_DATA
          durability: volatile            

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.2
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: prisma_rover/odom
    robot_base_frame: prisma_rover/base_footprint
    transform_tolerance: 0.1
    use_sim_time: True
    simulate_ahead_time: 2.0
    max_rotational_vel: 4.0
    min_rotational_vel: 0.0
    rotational_acc_lim: 4.0

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 10.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.3, 0.0, 4.0]
    min_velocity: [-0.3, 0.0, -4.0]
    max_accel: [0.1, 0.0, 4.0]
    max_decel: [-1.0, 0.0, -4.0]
    odom_topic: "odometry/filtered"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
