/**/aruco_node:
    ros__parameters:
        # Aruco detection parameters
        marker_size: 0.1 # Size of the markers in meters
        aruco_dictionary_id: DICT_ARUCO_ORIGINAL #DICT_4X4_50 # Aruco dictionary type
        
        # Input topics
        image_topic: color/image_raw # Input image topic
        use_depth_input: false # Use depth image for 3D pose estimation
        depth_image_topic: depth/image_raw # Input depth image topic
        camera_info_topic: color/camera_info # Input camera info topic with camera intrinsic parameters
        camera_frame: prisma_rover/camera_rgb_optical_frame # Camera link frame of reference
        map_frame: prisma_rover/map # Target coordinate frame for estimated markers
        
        # Output topics
        detected_markers_topic: aruco/markers # Output topic with detected markers (aruco poses + ids)
        markers_visualization_topic: aruco/poses # Output topic with visualization of detected markers as pose array
        output_image_topic: aruco/image # Output topic with visualization of detected markers drawn on image
        output_string_topic: aruco/string # Output topic with visualization of detected markers drawn on image